name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # MySQL chạy kèm trong lúc build để test tích hợp có database thật
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: warehouse_db
          MYSQL_USER: warehouse_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      # Mật khẩu dưới đây chỉ dùng cho container MySQL tạm thời trong CI, không phải mật khẩu thật
      DB_URL: jdbc:mysql://127.0.0.1:3306/warehouse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: warehouse_user
      DB_PASSWORD: ci_password

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Cấp quyền chạy cho mvnw (Windows không giữ quyền này khi commit)
        run: chmod +x mvnw

      - name: Build và chạy toàn bộ test
        run: ./mvnw -B verify

      - name: Lưu báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
