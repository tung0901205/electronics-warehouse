spring:
  application:
    name: warehouse

  datasource:
    # Có thể ghi đè bằng biến môi trường DB_URL (GitHub Actions dùng cổng 3306, máy bạn dùng 3307)
    url: ${DB_URL:jdbc:mysql://localhost:3307/warehouse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:warehouse_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate chỉ KIỂM TRA entity khớp bảng, bảng do Flyway quản lý
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Nạp quan hệ LAZY theo lô 20 dòng một lần, giảm số truy vấn khi hiển thị danh sách (tránh lỗi N+1)
        default_batch_fetch_size: 20

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Khóa ký JWT, tối thiểu 32 ký tự. Giá trị mặc định dưới đây CHỈ để học trên máy cá nhân.
    # Khi triển khai thật: đặt biến môi trường JWT_SECRET, không commit khóa thật.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789}
    access-token-minutes: 15
    refresh-token-days: 7
  bootstrap:
    # Tự tạo 5 tài khoản demo (admin, manager, staff, sales, viewer) khi bảng users còn trống.
    # Khi triển khai thật: đặt enabled=false.
    enabled: true
    password: Demo@12345

# Swagger UI: http://localhost:8080/swagger-ui.html   |   JSON: http://localhost:8080/v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    org.hibernate.SQL: DEBUG
